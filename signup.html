    <section class="auth-container">
        <div class="auth-box">
            <h2>Create account</h2>
            <form>
                <!-- <label for="text">Name</label> -->
                <input type="text" placeholder="Full Name" id="text" required>
                <!-- <label for="email">Email</label> -->
                <input type="email" placeholder="Enter Email" name="email" id="email" required >

                <div style="position: relative;">
                <input type="password" id="password" placeholder="Password" name="password" >
                 <span onclick="togglePassword()"
                style="position: absolute;
                right:10px;
                top:50%;
                transform:translateY(-50%);
                cursor:pointer;"
                >
                <i class="fa-solid fa-eye" id="togglePassword" style="color: red;"></i>
                </span>
                </div>
                <div style="position: relative;">
                <input type="password" id="password2" placeholder="Confirm Password" name="confirm password" required>
                <span onclick="toggleConfirmPassword()"
                style="position: absolute;
                right:10px;
                top:50%;
                transform:translateY(-50%);
                cursor:pointer;"
                >
                <i class="fa-solid fa-eye" id="icon2" style="color: red;"></i>
                </span>
                </div>
                <button type="submit">Signup</button>
            </form>
            <p>Already have an account? <a href="login.html">Login</a></p>
        </div>
    </section>
